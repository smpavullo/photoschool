# Builds the browser version (apps/photocraft-web) and publishes it on GitHub Pages.
# Self-contained: needs no secrets and no other repository.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: trunk@0.21.14

      # The upstream packaging script builds the app and the small page that starts it, and cuts
      # the wasm into parts so no file is too large. It writes dist/release/photocraft-web-<ver>.zip.
      - name: Build the web app
        run: bash packaging/web/package.sh

      - name: Unpack the site
        run: |
          mkdir site
          unzip -q dist/release/photocraft-web-*.zip -d site
          mv site/photocraft-web-*/* site/ 2>/dev/null || true
          rmdir site/photocraft-web-* 2>/dev/null || true
          # The app's glue imports helper scripts from snippets/; the zip doesn't carry them.
          if [ -d dist/web/snippets ]; then cp -R dist/web/snippets site/app/snippets; fi
          touch site/.nojekyll
          ls -la site | head -20

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4